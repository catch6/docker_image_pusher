name: Build Custom Images

on:
  workflow_dispatch:
    inputs:
      images:
        description: '要构建的镜像（name:tag 逗号分隔，留空则构建每个镜像的最新版本）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'docker.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGISTRY: '${{ secrets.ALIYUN_REGISTRY }}'
  ALIYUN_NAME_SPACE: '${{ secrets.ALIYUN_NAME_SPACE }}'
  ALIYUN_REGISTRY_USER: '${{ secrets.ALIYUN_REGISTRY_USER }}'
  ALIYUN_REGISTRY_PASSWORD: '${{ secrets.ALIYUN_REGISTRY_PASSWORD }}'
  DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
  DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: set-matrix
        run: |
          # 所有镜像列表
          ALL_IMAGES=$(find docker -type f -name "Dockerfile" | sed 's|docker/\(.*\)/\(.*\)/Dockerfile|\1:\2|' | sort)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.images }}" ]; then
              # 手动指定镜像列表
              IMAGES=$(echo "${{ github.event.inputs.images }}" | tr ',' '\n' | jq -R -s -c 'split("\n")[:-1]')
            else
              # 默认：每个镜像只构建最新版本（旧版本不可变，重建无意义）
              IMAGES=$(echo "$ALL_IMAGES" | sort -t: -k1,1 -k2,2V | awk -F: 'NF {a[$1]=$2} END {for (k in a) print k":"a[k]}' | jq -R -s -c 'split("\n")[:-1]')
            fi
          else
            # push 触发：只构建本次推送范围内变更目录下的镜像（支持一次 push 多个提交）
            BEFORE_SHA="${{ github.event.before }}"
            if ! CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- docker/); then
              # before 不可得（首次推送/force push），全量构建
              echo "No valid before SHA, building all images"
              CHANGED_FILES=$(find docker -type f | sort)
            fi
            CHANGED_IMAGES=""
            for img in $ALL_IMAGES; do
              IFS=':' read -r name tag <<< "$img"
              # 检查该镜像目录下是否有文件变更
              if echo "$CHANGED_FILES" | grep -q "^docker/${name}/${tag}/"; then
                CHANGED_IMAGES="${CHANGED_IMAGES}${img}"$'\n'
              fi
            done
            IMAGES=$(echo "$CHANGED_IMAGES" | grep -v '^$' | jq -R -s -c 'split("\n")[:-1]')
          fi

          echo "matrix=${IMAGES}" >> $GITHUB_OUTPUT
          echo "Images to build: ${IMAGES}"

  build-and-push:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10

    steps:
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build and Push Image
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u $ALIYUN_REGISTRY_USER --password-stdin $ALIYUN_REGISTRY
          echo "$DOCKERHUB_TOKEN" | docker login -u $DOCKERHUB_USERNAME --password-stdin

          # 从矩阵中获取镜像信息
          image_info="${{ matrix.image }}"
          echo "Processing: $image_info"

          # 分离镜像名称和标签
          IFS=':' read -r image_name image_tag <<< "$image_info"
          echo "Image name: $image_name"
          echo "Image tag: $image_tag"

          # 确定 Dockerfile 路径和构建上下文
          dockerfile_path="docker/$image_name/$image_tag/Dockerfile"
          context_path="docker/$image_name/$image_tag"
          echo "Dockerfile path: $dockerfile_path"

          # 检查 Dockerfile 是否存在
          if [ ! -f "$dockerfile_path" ]; then
            echo "Dockerfile not found: $dockerfile_path"
            exit 1
          fi

          # 构建推送到阿里云的镜像名称
          aliyun_image_name="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name:$image_tag"
          dockerhub_image_name="$DOCKERHUB_USERNAME/$image_name:$image_tag"
          echo "Building and pushing: $aliyun_image_name, $dockerhub_image_name"

          # 默认双架构；根目录 docker.txt 可覆盖，优先精确匹配 镜像名:标签，其次镜像名（对全部版本生效）
          OVERRIDE=$(grep -E "^${image_info} " docker.txt 2>/dev/null | awk '{print $2}' | head -1)
          [ -z "$OVERRIDE" ] && OVERRIDE=$(grep -E "^${image_name} " docker.txt 2>/dev/null | awk '{print $2}' | head -1)
          if [ -n "$OVERRIDE" ]; then
            PLATFORMS="$OVERRIDE"
            echo "Using platforms from platforms.txt: $PLATFORMS"
          else
            PLATFORMS="linux/amd64,linux/arm64"
            echo "Using default platforms: $PLATFORMS"
          fi

          # 使用 buildx 构建并直接推送（带重试）
          for i in 1 2 3; do
            docker buildx build --push \
              --platform "$PLATFORMS" \
              --provenance=false \
              -t "$aliyun_image_name" \
              -t "$dockerhub_image_name" \
              -f "$dockerfile_path" \
              "$context_path" && break
            echo "Build/push failed, retrying in 10s... ($i/3)"
            sleep 10
          done
